<!doctype html><meta charset="utf-8"><title>creatures</title>
<style>body{margin:8px;font:14px sans-serif;background:#ddd}canvas{background:#fff;margin:4px;max-width:46%;height:auto;border:1px solid #999}iframe{display:none}</style>
<pre id="out">PENDING</pre><div id="views"></div>
<iframe id="g" src="../Brackenford-Seven-Bells.html?release=0"></iframe>
<script>
// Draws each converted creature in assets/staging (not yet in the game) on white, with its skeleton laid over it,
// so the mesh, the colours and the bones can be checked. ?save=1 posts each picture to the local relay (port 8767).
const save=new URLSearchParams(location.search).get("save");
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// the game's shade colours: dark plum body, ember eyes. Faces that are clearly red stay ember; the rest are plum,
// keeping each face's own lightness so the facets still read.
function snap(r,g,b){const red=r>.7&&g<.35&&b<.35;if(red)return[.78,.2,.15];const l=(r*.3+g*.45+b*.25);const k=.55+l*1.1;return[.26*k,.13*k,.30*k];}
const wait=setInterval(async()=>{
 const w=document.getElementById("g").contentWindow;if(!w||!w.THREE)return;clearInterval(wait);
 const T=w.THREE,report=[];
 async function creature(file,name,turn){
  const m=await (await fetch("../assets/staging/"+file)).json();
  const p=new Int16Array(bytes(m.p).buffer),c=bytes(m.c),pos=new w.Float32Array(p.length),col=new w.Float32Array(p.length);   // made in the game frame, so its three.js recognises them
  for(let i=0;i<p.length;i++)pos[i]=p[i]/m.unit;
  for(let f=0;f<m.faces;f++){const k=snap(c[f*3]/255,c[f*3+1]/255,c[f*3+2]/255);for(let v=0;v<3;v++)col.set(k,f*9+v*3);}
  const geo=new T.BufferGeometry();geo.setAttribute("position",new T.BufferAttribute(pos,3));geo.setAttribute("color",new T.BufferAttribute(col,3));geo.computeVertexNormals();
  const make=bones=>{const g=new T.Group();g.add(new T.Mesh(geo,new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.95,transparent:bones,opacity:bones?.45:1})));
   if(bones){const pts=[];m.bones.forEach(b=>{if(b.parent>=0)pts.push(...m.bones[b.parent].head,...b.head);});const lg=new T.BufferGeometry();lg.setAttribute("position",new T.Float32BufferAttribute(pts,3));
    const ln=new T.LineSegments(lg,new T.LineBasicMaterial({color:0x1144ff,depthTest:false}));ln.renderOrder=5;g.add(ln);
    m.bones.forEach(b=>{const s=new T.Mesh(new T.SphereGeometry(.012,6,5),new T.MeshBasicMaterial({color:0xff7700,depthTest:false}));s.position.set(...b.head);s.renderOrder=6;g.add(s);});}
   g.rotation.y=turn;return g;};
  for(const [tag,dir,bones] of[["front",[.8,.35,1],false],["side",[1,.1,0],false],["bones",[.8,.35,1],true],["bones-top",[.05,1,.02],true]]){
   const cv=document.createElement("canvas");cv.width=cv.height=1000;document.getElementById("views").append(cv);
   const r=new T.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});r.setClearColor(0xffffff);
   const s=new T.Scene();s.add(new T.HemisphereLight(0xfff1cc,0xb9a58c,1.9));const sun=new T.DirectionalLight(0xffe5bb,2.3);sun.position.set(-3,6,5);s.add(sun);
   const o=make(bones);s.add(o);const b=new T.Box3().setFromObject(o),mid=b.getCenter(new T.Vector3()),size=b.getSize(new T.Vector3()),span=Math.max(size.x,size.y,size.z);
   const cam=new T.OrthographicCamera(-span*.62,span*.62,span*.62,-span*.62,.01,100);cam.position.copy(mid).add(new T.Vector3(...dir).normalize().multiplyScalar(span*4));if(tag==="bones-top")cam.up.set(0,0,-1);cam.lookAt(mid);r.render(s,cam);
   if(save){const blob=await new Promise(f=>cv.toBlob(f,"image/jpeg",.92));try{await fetch("http://127.0.0.1:8767/put/"+name+"-"+tag+".jpg",{method:"POST",mode:"no-cors",body:blob});}catch(e){}}
  }
  const used=new Set(bytes(m.si));report.push({name,faces:m.faces,bones:m.bones.length,bonesWithSkin:used.size,size:(()=>{const b=new T.Box3().setFromBufferAttribute(geo.attributes.position),s=b.getSize(new T.Vector3());return[s.x,s.y,s.z].map(v=>+v.toFixed(2));})()});
 }
 await creature("shade-hare-standing-rig.json","d1-hare-model",Math.PI);
 await creature("shade-crow-rig.json","d2-crow-model",-Math.PI/2);
 document.getElementById("out").textContent="RESULT "+JSON.stringify(report);
},200);
</script>
