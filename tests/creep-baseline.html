<!doctype html><meta charset="utf-8"><title>creep baseline</title><pre id="out">PENDING</pre>
<script>
// A repeatable version of the "creep.hitInOpen" check in tests/spirits.html, which fails now and then.
// That check waits until a creeping hare is moving in the open, shoots at where it is at that moment without leading
// it, and expects a hit. Here the game's random numbers are replaced by a fixed sequence, so each numbered run
// always plays out the same way, and the same runs can be made against two builds to see whether they differ.
//   ?build=../Brackenford-Seven-Bells.html   which built game to test (this is the default)
//   ?seeds=24                                how many numbered runs
const Q=new URLSearchParams(location.search),build=Q.get("build")||"../Brackenford-Seven-Bells.html",count=+Q.get("seeds")||24;
const seeded=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
function one(seed){
 return new Promise(done=>{
  for(const k of["brackenford-seven-bells-v1","brackenford-trials-v1"])localStorage.removeItem(k);
  const f=document.createElement("iframe");f.width=1000;f.height=640;f.src=build+"?release=0&r="+seed;document.body.append(f);
  const wait=setInterval(()=>{
   const w=f.contentWindow;if(!w||!w.vale)return;clearInterval(wait);
   try{
    w.Math.random=seeded(seed);
    const v=w.vale,T=v.T,S=v.spirits,r=v.range,R=n=>+n.toFixed(2),steps=n=>{for(let i=0;i<n;i++)v.tick(.016);};
    v.begin(false);steps(2);v.setStage(v.STAGES.findIndex(s=>s.spirits)+3);steps(40);
    const cr=S[0];for(let i=0;i<700;i++)steps(1);
    {let n=0;while(!(cr.wait<=0&&!cr.sunk)&&n++<600)steps(1);}
    const aim=cr.hitMesh.getWorldPosition(new T.Vector3()),was={pace:R(cr.pace),sunk:cr.sunk};
    steps(1);const o=v.rig.position.clone().add(new T.Vector3(0,1.5,0)),flat=new T.Vector3(aim.x-o.x,0,aim.z-o.z),d=flat.length(),h=aim.y-o.y,s=62,g=7;
    const ang=Math.atan((s*s-Math.sqrt(s**4-g*(g*d*d+2*h*s*s)))/(g*d));v.loose(o,flat.normalize().multiplyScalar(Math.cos(ang)).add(new T.Vector3(0,Math.sin(ang),0)),1);
    // follow the arrow's flight: how far the hare has moved from the point aimed at, and whether it has gone into grass
    let moved=0,sunkInFlight=false;for(let i=0;i<30;i++){steps(1);if(r.hits<1){moved=cr.hitMesh.getWorldPosition(new T.Vector3()).distanceTo(aim);if(cr.sunk)sunkInFlight=true;}}
    f.remove();done({seed,hit:r.hits>=1,distance:R(d),pace:was.pace,movedFromAim:R(moved),wentIntoGrass:sunkInFlight,waitingWhenShot:cr.wait>0});
   }catch(e){f.remove();done({seed,error:String(e)});}
  },200);
 });
}
(async()=>{
 const rows=[];for(let s=1;s<=count;s++){rows.push(await one(s));document.getElementById("out").textContent="RUNNING "+s+"/"+count;}
 const again=await one(1);   // the first run made a second time: it must come out the same
 document.getElementById("out").textContent="RESULT "+JSON.stringify({build,runs:count,hits:rows.filter(r=>r.hit).length,misses:rows.filter(r=>!r.hit),repeatable:JSON.stringify(again)===JSON.stringify(rows[0]),signature:rows.map(r=>r.error?"E":r.hit?"1":"0").join("")});
})();
</script>
