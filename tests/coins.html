<!doctype html><meta charset="utf-8"><pre id="out">PENDING</pre>
<script>
// Two loads of the game: a fresh one, and one over a save made before coins existed.
const KEY="brackenford-seven-bells-v1",errors=[],out={};
function load(){return new Promise(res=>{const old=document.getElementById("g");if(old)old.remove();const f=document.createElement("iframe");f.id="g";f.width=1000;f.height=640;f.src="../Brackenford-Seven-Bells.html?release=0&r="+Math.random();document.body.prepend(f);
 let n=0;const t=setInterval(()=>{const w=f.contentWindow;if(w&&w.vale){clearInterval(t);w.addEventListener("error",e=>errors.push(e.message));res(w);}else if(++n>120){clearInterval(t);res(null);}},250);});}
function play(w){
 const v=w.vale,T=v.T,V=(x,y,z)=>new T.Vector3(x,y,z),r=v.range,Y=v.YARD,M=v.rangeRounds,steps=n=>{for(let i=0;i<n;i++)v.tick(.016);};
 const fin=()=>{let n=0;while(r.phase!=="results"&&n++<900)steps(1);};
 const shootAt=(mark,off=0)=>{steps(1);const o=v.rig.position.clone().add(V(0,1.5,0)),to=mark.root.getWorldPosition(V()).add(V(Y.rx*off,0,Y.rz*off)),flat=V(to.x-o.x,0,to.z-o.z),d=flat.length(),h=to.y-o.y,s=62,g=7;
  const ang=Math.atan((s*s-Math.sqrt(s*s*s*s-g*(g*d*d+2*h*s*s)))/(g*d));v.loose(o,flat.normalize().multiplyScalar(Math.cos(ang)).add(V(0,Math.sin(ang),0)),1);steps(Math.ceil((d/55+.25)/.016));};
 return{v,r,M,steps,fin,shootAt};
}
(async()=>{
 try{
  localStorage.removeItem(KEY);
  let w=await load(),g=play(w);g.v.begin(false);g.steps(2);
  out.freshStart=g.v.state.coins;
  for(let i=0;i<5;i++)g.shootAt(g.M[0]);g.fin();
  out.firstClear={score:g.r.score,stars:g.r.stars,earned:g.r.earned,coins:g.v.state.coins,expected:Math.round(g.r.score/20)+g.r.stars*25};
  out.boardShowsCoins=g.v.lessonInfo?true:false;
  // same stage again: score coins only, no second star bonus
  g.r.pending="again";g.steps(2);for(let i=0;i<5;i++)g.shootAt(g.M[0]);g.fin();
  out.secondClear={earned:g.r.earned,expected:Math.round(g.r.score/20),coins:g.v.state.coins};
  // a weak run earns little and no star bonus
  g.r.pending="again";g.steps(2);g.shootAt(g.M[0],.75);for(let i=0;i<4;i++){g.v.loose(g.v.rig.position.clone().add(new g.v.T.Vector3(0,1.5,0)),new g.v.T.Vector3(g.v.YARD.ux,-.5,g.v.YARD.uz).normalize(),1);g.steps(30);}g.fin();
  out.weak={score:g.r.score,earned:g.r.earned};
  out.saved=JSON.parse(localStorage.getItem(KEY)).coins===g.v.state.coins;const total=g.v.state.coins;
  // reload: coins persist
  w=await load();out.persist=w.vale.state.coins===total;
  // an old save with stars and bests but no coins is paid for them once
  localStorage.setItem(KEY,JSON.stringify({bells:[],marks:[],lanterns:[],shots:40,longest:30,pos:null,done:false,lesson:2,mode:"range",range:{open:2,best:[600,500],stars:[3,2]}}));
  w=await load();out.oldSave={coins:w.vale.state.coins,expected:5*25+Math.round(1100/20),open:w.vale.state.range.open,lesson:w.vale.state.lesson};
  w.vale.tick(.016);w.vale.tick(7);const again=await load();out.oldSavePaidOnce=again.vale.state.coins===out.oldSave.coins;
  localStorage.removeItem(KEY);
  out.errors=errors;document.getElementById("out").textContent="RESULT "+JSON.stringify(out);
 }catch(e){document.getElementById("out").textContent="RESULT THREW "+e.stack;}
})();
</script>
