<!doctype html><meta charset="utf-8"><iframe id="g" src="../Brackenford-Seven-Bells.html?release=0" width="1000" height="640"></iframe><pre id="out">PENDING</pre>
<script>
const errors=[];
function run(){
 const w=document.getElementById("g").contentWindow;w.addEventListener("error",e=>errors.push(e.message));w.localStorage.removeItem("brackenford-seven-bells-v1");
 const v=w.vale,T=v.T,out={},R=n=>+n.toFixed(2),V=(x,y,z)=>new T.Vector3(x,y,z),r=v.range,Y=v.YARD,steps=n=>{for(let i=0;i<n;i++)v.tick(.016);};
 const fin=()=>{let n=0;while(r.phase!=="results"&&n++<1500)steps(1);};
 function shootPoint(to,wait=true){steps(1);const o=v.rig.position.clone().add(V(0,1.5,0)),flat=V(to.x-o.x,0,to.z-o.z),d=flat.length(),h=to.y-o.y,s=62,g=7;
  const ang=Math.atan((s*s-Math.sqrt(s*s*s*s-g*(g*d*d+2*h*s*s)))/(g*d));v.loose(o,flat.normalize().multiplyScalar(Math.cos(ang)).add(V(0,Math.sin(ang),0)),1);if(wait)steps(Math.ceil((d/55+.3)/.016));}
 const heart=sp=>sp.hitMesh.getWorldPosition(V()),B=()=>v.spirits.filter(s=>s.bird&&s.cfg),H=()=>v.spirits.filter(s=>!s.bird&&s.cfg);
 // aim ahead of something moving: where it will be when the arrow gets there
 function lead(sp){const a=heart(sp);steps(1);const b=heart(sp),vel=b.clone().sub(a).divideScalar(.016),tof=b.distanceTo(v.rig.position)/60+.03;return b.clone().addScaledVector(vel,tof);}
 const first=v.STAGES.findIndex(s=>s.spirits&&s.spirits.some(x=>x.t==="perch"));
 v.begin(false);steps(2);out.firstWingedStage=first+1;out.stages=v.STAGES.length;
 // --- On the post
 v.stageGo(first);steps(40);let b=B();
 out.perch={count:b.length,hares:H().length,posts:v.perches.filter(p=>p.visible).length,height:R(b[0].base.position.y-v.groundAt(b[0].base.position.x,b[0].base.position.z)),live:b.every(x=>x.live),wingsFolded:Math.abs(b[0].wings[0].rotation.z)>1};
 shootPoint(heart(b[0]));out.perch.hit={hits:r.hits,score:r.score,state:b[0].state};
 // a near miss lifts the next one off its post, and it comes back
 const near=heart(b[1]).add(V(Y.rx*1.3,0,Y.rz*1.3));shootPoint(near,false);steps(140);out.perch.nearMiss={state:b[1].state,live:b[1].live,streak:r.streak};
 steps(140);out.perch.gone=b[1].state;steps(380);out.perch.back={state:b[1].state,live:b[1].live};
 // a miss far from any of them disturbs nothing
 v.stageGo(first);steps(40);b=B();const farMiss=heart(b[0]).add(V(Y.rx*6,0,Y.rz*6));shootPoint(farMiss,false);steps(160);out.perch.farMissIgnored=b.every(x=>x.state==="idle");
 // --- Flush
 v.stageGo(first+1);steps(60);b=B();
 out.flush={count:b.length,bushes:v.bushes.filter(x=>x.visible).length,lurking:b.every(x=>x.state==="lurk"&&!x.live)};
 const sc=r.score;shootPoint(heart(b[0]));out.flush.cannotBeHitInBush=r.score===sc;steps(40);out.flush.landingFlushes={state:b[0].state,live:b[0].live,others:b.slice(1).every(x=>x.state==="lurk")};
 steps(25);const up=b[0].base.position.y;steps(25);out.flush.climbs=R(b[0].base.position.y-up);
 const hitsBefore=r.hits;shootPoint(lead(b[0]),false);steps(45);out.flush.shotInAir=r.hits===hitsBefore+1;
 // left alone, the others lose patience and go on their own, then are gone
 let n=0;while(b.slice(1).some(x=>x.state==="lurk")&&n++<1200)steps(1);out.flush.patienceEnds=R(n*.016);steps(420);out.flush.flownOffGone=b.slice(1).every(x=>x.done&&!x.base.visible);
 // --- Flight line
 v.stageGo(first+2);steps(40);b=B();const c0=b[0],p0=c0.base.position.clone();steps(30);
 out.cross={count:b.length,wind:R(r.wind),speed:R(c0.base.position.distanceTo(p0)/(30*.016)),height:R(c0.base.position.y-v.groundAt(c0.base.position.x,c0.base.position.z)),beating:c0.air===1};
 let hit=false;for(let k=0;k<6&&!hit;k++){n=0;while(!(c0.live&&c0.state==="idle"&&Math.abs(c0.right)<5)&&n++<900)steps(1);const h0=r.hits;shootPoint(lead(c0),false);steps(50);hit=r.hits>h0;}
 out.cross.ledShotHits=hit;
 const c1=b[1];let passes=0,last=c1.state;for(let i=0;i<1500;i++){steps(1);if(c1.state!==last){if(c1.state==="gap")passes++;last=c1.state;}}out.cross.passesIn24s=passes;
 // --- Blighted meadow: hares and winged shades together, and a replay of a winged one
 v.stageGo(first+3);steps(60);out.mixed={hares:H().length,birds:B().length,grass:v.grassClumps.filter(g=>g.visible).length,posts:v.perches.filter(p=>p.visible).length};
 const pb=B().find(x=>x.mode==="perch");shootPoint(heart(pb));out.mixed.perchHit=r.hits===1;
 for(let i=0;i<9;i++){v.loose(v.rig.position.clone().add(V(0,1.5,0)),V(Y.ux,-.5,Y.uz).normalize(),1);steps(25);}
 n=0;while(r.phase==="play"&&n++<400)steps(1);out.mixed.replay={phase:r.phase,winged:!!(r.shot&&r.shot.target.bird)};fin();out.mixed.results={phase:r.phase,stars:r.stars};
 v.setMode("roam");steps(2);out.roamHidesAll=!v.spirits.some(x=>x.base.visible)&&!v.perches.some(x=>x.visible)&&!v.bushes.some(x=>x.visible);
 w.localStorage.removeItem("brackenford-seven-bells-v1");
 out.errors=errors;return out;
}
let tries=0;const t=setInterval(()=>{const w=document.getElementById("g").contentWindow;if(w&&w.vale){clearInterval(t);let r;try{r=JSON.stringify(run());}catch(e){r="THREW "+e.stack;}document.getElementById("out").textContent="RESULT "+r;}else if(++tries>80){clearInterval(t);document.getElementById("out").textContent="RESULT no vale";}},250);
</script>
